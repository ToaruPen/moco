<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="color-scheme" content="dark light">
    <title>moco — operator console</title>
    <link rel="stylesheet" href="/static/styles.css">
  </head>
  <body>
    <header class="operator-bar">
      <span class="wordmark">moco</span>
      <span id="state" class="status-chip" data-status="muted" role="status" aria-live="polite">
        未接続
      </span>
      <span id="mic-state" class="status-chip" data-status="muted">MIC OFF</span>
      <span id="connection" class="status-chip" data-status="muted">WS OFFLINE</span>
      <div class="operator-actions">
        <label class="device-control" for="audio-input">
          <span>INPUT</span>
          <select id="audio-input" aria-label="入力マイク" disabled>
            <option value="">接続待ち</option>
          </select>
        </label>
        <label class="device-control" for="audio-output">
          <span>OUTPUT</span>
          <select id="audio-output" aria-label="音声出力先" disabled>
            <option value="">接続待ち</option>
          </select>
        </label>
        <label class="voice-control" for="voice">
          <span>VOICE</span>
          <select id="voice" aria-label="音声モデル" disabled>
            <option>接続待ち</option>
          </select>
        </label>
        <button
          id="listen-start"
          type="button"
          aria-label="音声入力を開始"
          aria-pressed="false"
          disabled
        >
          <span id="start-key" class="keycap">—</span>
          <span class="desktop-action-label">開始</span>
          <span class="mobile-action-label">入力開始</span>
        </button>
        <button id="listen-stop" type="button" aria-label="音声入力を停止" disabled>
          <span id="stop-key" class="keycap">—</span>
          <span class="desktop-action-label">停止</span>
          <span class="mobile-action-label">入力停止</span>
        </button>
        <button
          id="turn-cancel"
          type="button"
          aria-label="実行中の処理を取り消す"
          disabled
        >
          処理を取消
        </button>
        <button id="pairing-open" type="button" hidden>スマホ接続</button>
        <button
          id="theme-toggle"
          type="button"
          aria-haspopup="dialog"
          aria-expanded="false"
          aria-controls="theme-panel"
        >
          配色
        </button>
      </div>
    </header>

    <div id="connection-row" class="connection-row">
      <button id="enable" class="connection-action" type="button">接続</button>
      <p>マイク停止後も、Codex の処理と音声再生は継続します。</p>
    </div>

    <section class="progress-band" aria-label="現在の処理状況">
      <span id="progress-label">接続を待っています</span>
      <span id="progress-elapsed" class="progress-time">00:00</span>
      <span id="progress-updated">更新なし</span>
    </section>

    <section id="error" class="error-band" role="alert" hidden>
      <span id="error-text"></span>
      <button id="error-close" type="button">閉じる</button>
    </section>

    <main class="workspace">
      <section class="conversation-pane panel" aria-labelledby="conversation-title">
        <header class="panel-header">
          <div>
            <h2 id="conversation-title">会話</h2>
            <p>この画面のみ・保存されません</p>
          </div>
          <button id="clear" type="button">消去</button>
        </header>
        <div id="transcript" class="transcript" role="log" aria-live="polite">
          <p class="transcript-empty">接続後、開始を押すか設定キーで話しかけると表示されます。</p>
        </div>
      </section>

      <section class="activity-pane panel" aria-labelledby="activity-title">
        <header class="panel-header">
          <div>
            <h2 id="activity-title">アクティビティ</h2>
            <p>一時ログ・最大200件</p>
          </div>
          <button id="activity-latest" type="button" hidden>最新へ</button>
        </header>
        <div id="activity" class="activity" role="log" aria-live="off">
          <p class="activity-empty">接続後の処理状況がここに表示されます。</p>
        </div>
      </section>
    </main>

    <section id="theme-panel" class="theme-panel" data-theme-panel role="dialog" aria-label="配色" hidden>
      <header class="theme-header">
        <div>
          <h2>配色</h2>
          <p>このブラウザだけに保存されます</p>
        </div>
        <button id="theme-close" type="button">閉じる</button>
      </header>
      <fieldset id="theme-presets" class="theme-presets">
        <legend>プリセット</legend>
      </fieldset>
      <details>
        <summary>詳細配色</summary>
        <div id="theme-colors" class="theme-colors"></div>
      </details>
      <p id="theme-validation" class="theme-validation" role="status" aria-live="polite"></p>
      <button id="theme-reset" type="button">プリセットに戻す</button>
    </section>

    <section id="pairing-panel" class="pairing-panel" role="dialog" aria-label="スマホ接続" hidden>
      <header class="pairing-header">
        <div>
          <h2>スマホ接続</h2>
          <p>Cloudflare Access 認証後、この端末だけで使用します</p>
        </div>
        <button id="pairing-close" type="button">閉じる</button>
      </header>
      <img id="pairing-image" alt="スマートフォン接続用QRコード">
    </section>

    <script type="module" src="/static/app.js"></script>
  </body>
</html>
