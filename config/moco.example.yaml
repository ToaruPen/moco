# moco configuration. Unknown keys are rejected.
server:
  # moco stays loopback-only; cloudflared connects to this origin.
  host: 127.0.0.1
  port: 8765
  # Optional stable hostname protected by Cloudflare Access. No path or port.
  public_url: null

hotkeys:
  enabled: true
  start_listening: f1
  stop_listening: f2

runtime:
  # Close only the conversation after five inactive minutes.
  idle_timeout_seconds: 300

codex:
  binary: /Applications/ChatGPT.app/Contents/Resources/codex
  working_directory: /Users/your-name
  # null checks ~/.moco/prompt.md and falls back to the built-in prompt when absent.
  # Set an absolute path (or a path beginning with ~) to require another prompt file.
  prompt_file: null

irodori:
  # Replace with the Windows node's portless Tailscale Serve URL.
  base_url: https://windows-node.example.ts.net
  # Optional direct tailnet address when the OS cannot resolve MagicDNS.
  # HTTPS still verifies the base_url hostname through SNI.
  connect_ip: null
  # Preferred voice ID from the runtime catalog; null uses the catalog default.
  speaker: null
  # Captions remain disabled during the initial v4 migration.
  caption_mode: "off"
  # Current operational choice; these remain tunable sampling settings, not protocol constants.
  num_steps: 12
  t_schedule_mode: sway
  duration_scale: 1.0
  cfg_scale_text: 3.0
  cfg_scale_speaker: 5.0
  # Readiness checks remain bounded; synthesis itself has no timeout.
  timeout_seconds: 30
  max_wav_bytes: 33554432

speech:
  segment_max_chars: 80
  # Disabled until the adaptive first-segment rollout gates are approved.
  first_segment_soft_break_min_chars: null
  vad_threshold: 0.04
  vad_hold_ms: 120

telemetry:
  console: true
  # Optional HTTP(S) OpenTelemetry collector endpoint.
  otlp_endpoint: null
  service_name: moco
