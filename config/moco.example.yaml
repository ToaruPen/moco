# moco configuration. Unknown keys are rejected.
server:
  # moco stays loopback-only; cloudflared connects to this origin.
  host: 127.0.0.1
  port: 8765
  # Optional stable hostname protected by Cloudflare Access. No path or port.
  public_url: null

hotkeys:
  enabled: true
  start_listening: f1
  stop_listening: f2

runtime:
  # Close only the conversation after five inactive minutes.
  idle_timeout_seconds: 300

codex:
  binary: /Applications/ChatGPT.app/Contents/Resources/codex
  working_directory: /Users/your-name

irodori:
  # Replace with the Windows node's portless Tailscale Serve URL.
  base_url: https://windows-node.example.ts.net
  # Optional direct tailnet address when the OS cannot resolve MagicDNS.
  # HTTPS still verifies the base_url hostname through SNI.
  connect_ip: null
  # Portable speaker name; null uses the Irodori server default.
  speaker: null
  # Speaker models shown in the browser selector.
  speakers: []
  num_steps: 24
  duration_scale: 1.0
  cfg_scale_text: 3.0
  cfg_scale_speaker: 5.0
  # Readiness checks remain bounded; synthesis itself has no timeout.
  timeout_seconds: 30
  max_wav_bytes: 33554432

speech:
  segment_max_chars: 80
  vad_threshold: 0.04
  vad_hold_ms: 120

telemetry:
  console: true
  # Optional HTTP(S) OpenTelemetry collector endpoint.
  otlp_endpoint: null
  service_name: moco
